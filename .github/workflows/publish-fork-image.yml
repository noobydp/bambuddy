name: Publish fork Docker image

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-fork-image
  cancel-in-progress: true

jobs:
  publish:
    name: Build and publish linux/amd64 image
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/noobydp/bambuddy:latest
            ghcr.io/noobydp/bambuddy:klipper-moonraker
            ghcr.io/noobydp/bambuddy:flashforge-creator5pro
          labels: |
            org.opencontainers.image.source=https://github.com/noobydp/bambuddy
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.description=Bambuddy fork with FlashForge, Klipper, and Printables support
          cache-from: type=gha,scope=fork-image
          cache-to: type=gha,scope=fork-image,mode=max
